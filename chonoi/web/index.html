<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — Sông Nước Miền Tây</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #091219;
    color: #eaf3f8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
    user-select: none;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";

const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false;

// ---------- ĐIỀU KHIỂN BÀN PHÍM ----------
const down = new Set();
const MOVE_KEYS = {
  w: "u", arrowup: "u",
  s: "d", arrowdown: "d",
  a: "l", arrowleft: "l",
  d: "r", arrowright: "r"
};
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const mode = snap ? snap.mode : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);
  if (mode === "quan") dy = -dy;
  return {
    move: [dx, dy],
    interact: down.has("interact"),
    catch: down.has("catch"),
    attack: down.has("attack"),
    pause: down.has("pause"),
    shop_done: down.has("shop_done")
  };
}

function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}

async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try {
      await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } });
    } catch (e) {}
  }
  inflight = false;
}

function keyName(e) { return e.key.toLowerCase(); }

addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (e.repeat) {
    if (k === " " || k.startsWith("arrow") || k === "q") e.preventDefault();
    return;
  }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "q") { down.add("attack"); e.preventDefault(); }
  else if (k === "p") { down.add("pause"); e.preventDefault(); }
  else if (k === "enter") { down.add("shop_done"); e.preventDefault(); }
  else if (k === "r") {
    fetch("/restart", { method: "POST" });
    lastSent = "";
    down.clear();
  }
  pushInput();
});

addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  else if (k === "q") down.delete("attack");
  else if (k === "p") down.delete("pause");
  else if (k === "enter") down.delete("shop_done");
  pushInput();
});

addEventListener("blur", () => { down.clear(); pushInput(); });

// ---------- POLLING SNAPSHOT ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
  } catch (e) {
    offline = true;
  }
  setTimeout(poll, 16);
}
poll();

// ---------- BẢNG MÀU SÔNG NƯỚC NAM BỘ ----------
const KIND_COLOR = {
  ca_loc: "#4a6b32",
  ca_linh: "#b2ebf2",
  ca_keo: "#d88d44",
  bong_dien_dien: "#fbc02d",
  bong_sung: "#ec407a",
  keo_neo: "#7cb342"
};

const KIND_NAME = {
  ca_loc: "Cá lóc",
  ca_linh: "Cá linh",
  ca_keo: "Cá kèo",
  bong_dien_dien: "Điên điển",
  bong_sung: "Bông súng",
  keo_neo: "Kèo nèo"
};

const DISH_NAME = {
  ca_loc_nuong_trui: "Cá lóc nướng trui",
  goi_bong_sung: "Gỏi bông súng",
  lau_ca_linh_dien_dien: "Lẩu cá linh điên điển",
  canh_chua_ca_loc: "Canh chua cá lóc",
  ca_keo_nuong: "Cá kèo nướng muối ớt",
  lau_mam: "Lẩu mắm miền Tây"
};

const kc = (k) => KIND_COLOR[k] || "#90a4ae";

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}

function text(s, x, y, o = {}) {
  ctx.font = (o.weight ? o.weight + " " : "") + (o.size || 13) + "px system-ui, sans-serif";
  ctx.fillStyle = o.color || "#eaf3f8";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(s, x, y);
}

function bar(x, y, w, h, frac, color, label, subcolor = "rgba(0,0,0,0.5)") {
  ctx.fillStyle = subcolor;
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(x, y, w, h, 4) : ctx.rect(x, y, w, h);
  ctx.fill();

  const clamp = Math.max(0, Math.min(1, frac));
  if (clamp > 0) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x, y, w * clamp, h, 4) : ctx.rect(x, y, w * clamp, h);
    ctx.fill();
  }

  ctx.strokeStyle = "rgba(255,255,255,0.3)";
  ctx.lineWidth = 1;
  ctx.stroke();

  if (label) {
    text(label, x + w / 2, y + h / 2 + 3.5, { size: 10, weight: "bold", align: "center", color: "#ffffff" });
  }
}

function fmtTime(ticks) {
  const s = Math.ceil(ticks / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

function brief(d) {
  try {
    const s = JSON.stringify(d);
    return s.length > 50 ? s.slice(0, 47) + "…" : s;
  } catch (e) { return ""; }
}

function eventLog(w, h) {
  const ev = (snap.events || []).slice(-5);
  ev.forEach((e, i) => {
    text(`t${e.tick} ${e.name} ${brief(e.data)}`, w - 16, h - 68 - (ev.length - 1 - i) * 15, {
      size: 11,
      align: "right",
      color: "rgba(215,235,248,0.75)"
    });
  });
}

function overlay(w, h) {
  if (offline) {
    ctx.fillStyle = "rgba(211,47,47,0.9)";
    ctx.fillRect(w / 2 - 180, 20, 360, 36);
    text("⚠️ Mất kết nối tới máy chủ (kiểm tra live.py)", w / 2, 43, { align: "center", size: 14, weight: "bold" });
  }
  if (snap.error) {
    ctx.fillStyle = "rgba(183,28,28,0.95)";
    ctx.fillRect(w / 2 - 220, 65, 440, 40);
    text("Lỗi mô phỏng — xem terminal. Bấm R để chơi lại.", w / 2, 90, { align: "center", size: 14 });
  }
  if (snap.state === "paused") {
    ctx.fillStyle = "rgba(9,18,25,0.8)";
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "#ffb300";
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(w / 2 - 170, h / 2 - 45, 340, 90, 8) : ctx.rect(w / 2 - 170, h / 2 - 45, 340, 90);
    ctx.fill();
    text("⏸ ĐANG TẠM DỪNG", w / 2, h / 2 - 8, { align: "center", size: 20, weight: "bold", color: "#1f1802" });
    text("Nhấn phím P để tiếp tục chèo xuồng", w / 2, h / 2 + 22, { align: "center", size: 13, color: "#423204" });
  }
  if (snap.finished) {
    ctx.fillStyle = "rgba(11,22,30,0.85)";
    ctx.fillRect(w / 2 - 210, h / 2 - 65, 420, 130);
    ctx.strokeStyle = "#4db6ac";
    ctx.lineWidth = 2;
    ctx.strokeRect(w / 2 - 210, h / 2 - 65, 420, 130);
    text("KẾT THÚC CA: " + (snap.reason || ""), w / 2, h / 2 - 16, { align: "center", size: 20, weight: "bold", color: "#80cbc4" });
    text(`Doanh thu: ${snap.earned ?? 0}k · Uy tín: ${(snap.reputation ?? 0).toFixed(1)}⭐ · Điểm: ${snap.score ?? 0}`, w / 2, h / 2 + 12, { align: "center", size: 14, color: "#fff" });
    text("Nhấn phím R để chơi lại", w / 2, h / 2 + 40, { align: "center", color: "#b0bec5" });
  }
}

// ---------- HÀM VẼ CHI TIẾT ĐẬM CHẤT NAM BỘ ----------

// 1. Rặng dừa nước rủ bóng ven sông
function drawCoconutPalm(x, y, scale, angle = 0) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.scale(scale, scale);

  ctx.strokeStyle = "#2e4a23";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(-20, -40, -50, -60);
  ctx.stroke();

  // Các phiến lá dừa nước xanh mướt
  ctx.fillStyle = "#437032";
  for (let i = 1; i <= 8; i++) {
    const t = i / 9;
    const lx = -50 * t, ly = -60 * Math.pow(t, 1.3);
    ctx.beginPath();
    ctx.ellipse(lx - 8, ly - 3, 16, 4, -0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(lx + 8, ly + 2, 16, 4, 0.4, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// 2. Út Sen (Áo bà ba cam, nón lá, khăn rằn)
function drawUtSen(px, py, s, headingDeg, underwater, invuln, now) {
  if (invuln > 0 && Math.floor(now / 80) % 2) return;

  ctx.save();
  ctx.translate(px, py);

  // Nếu bơi dưới nước: sinh bọt khí nổi lên
  if (underwater) {
    ctx.fillStyle = "rgba(255, 255, 255, 0.55)";
    for (let b = 0; b < 3; b++) {
      const boff = ((now / 20 + b * 15) % 40) * 0.08 * s;
      ctx.beginPath();
      ctx.arc(-Math.cos(headingDeg * Math.PI / 180) * (0.8 * s + boff), -boff * 1.5, 1.8 + b, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Thân áo bà ba cam rực rỡ
  ctx.fillStyle = "#ff6f00";
  ctx.beginPath();
  ctx.arc(0, 0, 0.7 * s, 0, Math.PI * 2);
  ctx.fill();

  // Khăn rằn đen trắng vắt qua vai
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(0, -0.1 * s, 0.45 * s, 0.3 * Math.PI, 0.7 * Math.PI);
  ctx.stroke();

  // Nón lá Nam Bộ chóp nhọn vàng rơm
  ctx.fillStyle = "#ffe082";
  ctx.beginPath();
  ctx.moveTo(0, -0.95 * s);
  ctx.lineTo(-0.75 * s, -0.15 * s);
  ctx.lineTo(0.75 * s, -0.15 * s);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = "#d7ccc8";
  ctx.lineWidth = 1;
  ctx.stroke();

  // Mũi hướng nhìn
  const a = (headingDeg * Math.PI) / 180;
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(Math.cos(a) * 1.05 * s, Math.sin(a) * 1.05 * s);
  ctx.stroke();

  ctx.restore();
}

// 3. Cá Sấu Năm Chèo (Thủy quái sông nước)
function drawCrocodile(mx, my, s, state, mId, now) {
  const isChase = state === "chase";
  ctx.save();
  ctx.translate(mx, my);

  // Nếu đang chase: vẽ vệt sóng nước rẽ hình chữ V hung tợn
  if (isChase) {
    ctx.strokeStyle = "rgba(255, 82, 82, 0.35)";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(1.8 * s, 0);
    ctx.lineTo(3.8 * s, -1.2 * s);
    ctx.moveTo(1.8 * s, 0);
    ctx.lineTo(3.8 * s, 1.2 * s);
    ctx.stroke();
  }

  // Thân cá sấu vảy rồng sẫm
  ctx.fillStyle = isChase ? "#b71c1c" : "#1b5e20";
  ctx.beginPath();
  ctx.ellipse(0, 0, 2.0 * s, 0.7 * s, 0, 0, Math.PI * 2);
  ctx.fill();

  // Gai sống lưng sần sùi
  ctx.fillStyle = isChase ? "#ff5252" : "#4caf50";
  for (let g = -1.2; g <= 1.2; g += 0.4) {
    ctx.beginPath();
    ctx.moveTo(g * s, -0.65 * s);
    ctx.lineTo((g + 0.15) * s, -1.0 * s);
    ctx.lineTo((g + 0.3) * s, -0.65 * s);
    ctx.fill();
  }

  // Đuôi cá sấu quẫy
  const tailWave = Math.sin(now / 120) * 0.25 * s;
  ctx.fillStyle = isChase ? "#b71c1c" : "#1b5e20";
  ctx.beginPath();
  ctx.moveTo(1.8 * s, 0);
  ctx.lineTo(3.2 * s, -0.4 * s + tailWave);
  ctx.lineTo(3.0 * s, 0.4 * s + tailWave);
  ctx.closePath();
  ctx.fill();

  // Mõm dài và hàm răng nhọn
  ctx.beginPath();
  ctx.moveTo(-1.6 * s, -0.35 * s);
  ctx.lineTo(-2.8 * s, -0.1 * s);
  ctx.lineTo(-2.8 * s, 0.1 * s);
  ctx.lineTo(-1.6 * s, 0.35 * s);
  ctx.fill();

  // Mắt đỏ rực hung tợn
  ctx.fillStyle = "#ff1744";
  ctx.beginPath();
  ctx.arc(-1.4 * s, -0.35 * s, 0.22 * s, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();

  text(`${mId} [${state}]`, mx, my - 1.2 * s, {
    size: 11,
    weight: "bold",
    align: "center",
    color: isChase ? "#ff8a80" : "#a5d6a7"
  });
}

// 4. Bếp lò đất nung & tàn lửa bập bùng
function drawStove(st, sx, sy, s, now) {
  const isCook = st.state === "cooking";
  const isReady = st.state === "ready";

  // Thân lò đất nung tròn
  ctx.fillStyle = isCook ? "#bf360c" : isReady ? "#2e7d32" : "#5d4037";
  ctx.beginPath();
  ctx.arc(sx, sy, 0.95 * s, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#271c19";
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // Miệng lò than đỏ rực
  ctx.fillStyle = isCook ? "#ff3d00" : "#3e2723";
  ctx.beginPath();
  ctx.arc(sx, sy, 0.55 * s, 0, Math.PI * 2);
  ctx.fill();

  // Lửa bập bùng và tàn lửa khi đang nấu
  if (isCook) {
    const flameH = (0.3 + Math.sin(now / 50 + sx) * 0.15) * s;
    ctx.fillStyle = "#ffeb3b";
    ctx.beginPath();
    ctx.moveTo(sx - 0.3 * s, sy);
    ctx.lineTo(sx, sy - 0.7 * s - flameH);
    ctx.lineTo(sx + 0.3 * s, sy);
    ctx.fill();

    // Hạt tàn lửa bay lên
    ctx.fillStyle = "#ff9800";
    for (let sp = 0; sp < 2; sp++) {
      const spY = sy - 0.8 * s - ((now / 15 + sp * 20) % 30) * 0.05 * s;
      ctx.beginPath();
      ctx.arc(sx + (sp ? 0.2 : -0.2) * s, spY, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  text(st.id, sx, sy + 3.5, { size: 12, weight: "bold", align: "center", color: "#ffffff" });

  if (st.dish) {
    text(DISH_NAME[st.dish] || st.dish, sx, sy - 1.15 * s, { size: 10, weight: "bold", align: "center", color: "#fff3e0" });
  }
  if (isCook && st.cook_ticks_left !== undefined) {
    text(Math.ceil(st.cook_ticks_left / 60) + "s", sx, sy + 1.45 * s, { size: 12, weight: "bold", align: "center", color: "#ffe082" });
  }
}

// =============================================================================
// CẢNH 1: LẶN & HÁI VEN SÔNG NAM BỘ (GATHER)
// =============================================================================
function drawGather(w, h, now) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const top = 70, bottom = 85;
  const s = Math.max(1, Math.min((w - 30) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;

  // 1. Bầu trời rực nắng phương Nam
  const skyGrad = ctx.createLinearGradient(0, top, 0, oy);
  skyGrad.addColorStop(0, "#b2dfdb");
  skyGrad.addColorStop(1, "#e0f2f1");
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, top, w, SKY * s);

  // 2. Rặng dừa nước hai bên mép bãi sông
  drawCoconutPalm(sx(2), oy - 2 * s, s * 0.7, 0.3);
  drawCoconutPalm(sx(X - 2), oy - 2 * s, s * 0.7, -0.4);

  // 3. Dòng nước sông Tiền phù sa cuộn sóng
  const riverGrad = ctx.createLinearGradient(0, oy, 0, sy(D));
  riverGrad.addColorStop(0, "#39889e");   // mặt nước xanh ngọc phù sa
  riverGrad.addColorStop(0.35, "#225a6b"); // tầng giữa
  riverGrad.addColorStop(1, "#0a1d29");    // đáy sông sâu thẳm
  ctx.fillStyle = riverGrad;
  ctx.fillRect(sx(0), oy, X * s, D * s);

  // Mặt nước lăn tăn nhấp nhô sống động
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (let wx = 0; wx <= X; wx += 2) {
    const waveY = oy + Math.sin(now / 300 + wx * 0.3) * 1.5;
    if (wx === 0) ctx.moveTo(sx(wx), waveY);
    else ctx.lineTo(sx(wx), waveY);
  }
  ctx.stroke();

  // Vạch đo độ sâu
  for (let d = 5; d <= D; d += 5) {
    ctx.strokeStyle = "rgba(255,255,255,0.08)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(sx(0), sy(d));
    ctx.lineTo(sx(X), sy(d));
    ctx.stroke();
    text(d + "m", sx(0) + 5, sy(d) - 3, { size: 10, color: "rgba(255,255,255,0.4)" });
  }

  // 4. Hiệu ứng Dòng lũ cuộn (Phase 3 current)
  if (snap.current) {
    const cur = snap.current;
    const dir = cur.direction || 1;
    ctx.fillStyle = "rgba(255, 235, 59, 0.08)";
    ctx.fillRect(sx(0), sy(10), X * s, (D - 10) * s);

    // Mũi tên dòng chảy lướt qua sông
    const flowT = (now / 20) % 100;
    ctx.fillStyle = "rgba(255, 255, 255, 0.28)";
    for (let f = 0; f < 14; f++) {
      const fx = (f * 7.5 + (dir > 0 ? flowT : -flowT) + 100) % 96 + 2;
      const fd = 12 + (f % 5) * 3.5;
      ctx.beginPath();
      ctx.arc(sx(fx), sy(fd), 2.2 * s, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // 5. Bến phà chợ nổi (Dock Út Sen)
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  ctx.fillStyle = "#8d6e63"; // Sàn gỗ đước
  ctx.fillRect(sx(dp[0] - 1.8), sy(-0.9), 3.6 * s, 1.0 * s);

  // Mái lá dừa nước mộc mạc
  ctx.fillStyle = "#5d4037";
  ctx.beginPath();
  ctx.moveTo(sx(dp[0] - 2.2), sy(-0.9));
  ctx.lineTo(sx(dp[0]), sy(-2.8));
  ctx.lineTo(sx(dp[0] + 2.2), sy(-0.9));
  ctx.fill();

  ctx.strokeStyle = "rgba(255, 215, 64, 0.85)";
  ctx.setLineDash([5, 4]);
  ctx.beginPath();
  ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);
  text("⚓ BẾN ÚT SEN (E)", sx(dp[0]), sy(-3.1), { size: 11, weight: "bold", align: "center", color: "#ffe082" });

  // 6. Nút hái bông súng, điên điển, kèo nèo
  (snap.nodes || []).forEach((n) => {
    const ready = n.ready !== false;
    ctx.globalAlpha = ready ? 1.0 : 0.35;
    ctx.fillStyle = kc(n.kind);
    ctx.beginPath();
    ctx.ellipse(sx(n.pos[0]), sy(n.pos[1]) - 0.15 * s, 1.0 * s, 0.45 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;

    text(n.id, sx(n.pos[0]), sy(n.pos[1]) - 0.8 * s, { size: 10, weight: "bold", align: "center", color: "#1b2832" });
    if (!ready && n.regrow_ticks) {
      text(Math.ceil(n.regrow_ticks / 60) + "s", sx(n.pos[0]), sy(n.pos[1]) + 1.2 * s, { size: 10, align: "center", color: "#fff" });
    }
  });

  // 7. Đàn cá bơi lội dưới nước
  (snap.fish || []).forEach((f) => {
    ctx.save();
    ctx.translate(sx(f.pos[0]), sy(f.pos[1]));
    ctx.rotate(((f.heading_deg || 0) * Math.PI) / 180);
    ctx.fillStyle = kc(f.kind);

    // Thân cá
    ctx.beginPath();
    ctx.ellipse(0, 0, 1.05 * s, 0.45 * s, 0, 0, Math.PI * 2);
    ctx.fill();

    // Đuôi cá vẫy nhịp nhàng
    const fin = Math.sin(now / 100 + f.pos[0]) * 0.15 * s;
    ctx.beginPath();
    ctx.moveTo(-0.9 * s, 0);
    ctx.lineTo(-1.6 * s, -0.45 * s + fin);
    ctx.lineTo(-1.6 * s, 0.45 * s + fin);
    ctx.fill();
    ctx.restore();

    text(f.id, sx(f.pos[0]), sy(f.pos[1]) - 0.8 * s, { size: 10, align: "center", color: "rgba(255,255,255,0.85)" });
  });

  // 8. Cá Sấu Năm Chèo (Monsters M1, M2)
  (snap.monsters || []).forEach((m) => {
    drawCrocodile(sx(m.pos[0]), sy(m.pos[1]), s, m.state, m.id, now);
  });

  // 9. Nhân vật Út Sen
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    const underwater = p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface;

    if (meta.catch_radius && underwater) {
      ctx.strokeStyle = "rgba(79, 195, 247, 0.35)";
      ctx.beginPath();
      ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2);
      ctx.stroke();
    }
    if (meta.interact_radius && !underwater) {
      ctx.strokeStyle = "rgba(255, 215, 64, 0.4)";
      ctx.beginPath();
      ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2);
      ctx.stroke();
    }

    drawUtSen(px, py, s, p.heading_deg || 0, underwater, p.invuln_ticks || 0, now);
  }

  // 10. HUD TRÊN
  text("⏱ " + fmtTime(snap.time_left_ticks), 16, 32, { size: 22, weight: "bold", color: "#ffffff" });

  if (p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks) {
    const oxyLow = p.oxygen_ticks < p.oxygen_max_ticks * 0.25;
    bar(125, 16, 210, 20, p.oxygen_ticks / p.oxygen_max_ticks, oxyLow ? "#ef5350" : "#29b6f6", "Oxy: " + Math.ceil(p.oxygen_ticks / 60) + "s");
  }

  if (p && p.hp !== undefined && p.hp_max) {
    let hs = "";
    for (let i = 0; i < p.hp_max; i++) hs += i < p.hp ? "❤️ " : "🖤 ";
    text(hs, 355, 32, { size: 16 });
  }

  // Banner dòng lũ
  if (snap.current) {
    const c = snap.current;
    const arrow = c.direction > 0 ? "➜ Sang phải" : "⬅ Sang trái";
    ctx.fillStyle = "rgba(255, 167, 38, 0.28)";
    ctx.strokeStyle = "#ffa726";
    ctx.strokeRect(480, 14, 240, 24);
    ctx.fillRect(480, 14, 240, 24);
    text(`🌊 Dòng lũ: ${arrow} (${Math.ceil(c.ticks_left / 60)}s)`, 490, 31, { size: 12, weight: "bold", color: "#ffe082" });
  }

  // 11. HUD DƯỚI: GIỎ ĐỒ VÀ ĐỘ TƯƠI CÁ THỂ
  if (snap.hold && snap.hold_capacity) {
    const cap = snap.hold_capacity;
    const sz = Math.min(38, (w - 280) / cap - 6);
    const y0 = h - bottom + 12;

    for (let i = 0; i < cap; i++) {
      const x0 = 16 + i * (sz + 6);
      ctx.fillStyle = "rgba(255, 255, 255, 0.08)";
      ctx.fillRect(x0, y0, sz, sz);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
      ctx.strokeRect(x0, y0, sz, sz);

      const it = snap.hold[i];
      if (it) {
        const isObj = typeof it === "object";
        const kind = isObj ? it.kind : it;
        const fresh = isObj ? (it.fresh ?? 100) : 100;

        ctx.fillStyle = kc(kind);
        ctx.fillRect(x0 + 3, y0 + 3, sz - 6, sz - 10);

        // Thanh đo độ tươi (vạch màu)
        const freshCol = fresh >= 70 ? "#4caf50" : fresh >= 30 ? "#ffb300" : "#f44336";
        ctx.fillStyle = freshCol;
        ctx.fillRect(x0 + 2, y0 + sz - 5, (sz - 4) * (fresh / 100.0), 3);

        if (isObj && it.id) {
          text(it.id, x0 + sz / 2, y0 + sz / 2, { size: 9, weight: "bold", align: "center", color: "#111" });
        }
      }
    }

    const itemsCount = snap.hold.length;
    text(`Giỏ hàng Út Sen (${itemsCount}/${cap} ô) — Vạch màu hiển thị độ tươi (đỏ: sắp ươn)`, 16, y0 - 8, {
      size: 12,
      weight: "bold",
      color: "#b0bec5"
    });
  }

  text("WASD: Bơi · E: Hái/Bến · Space: Bắt cá · Q: Lao xua quái · P: Tạm dừng · R: Chơi lại", w - 16, h - 16, {
    size: 12,
    align: "right",
    color: "#90a4ae"
  });
}

// =============================================================================
// CẢNH 2: NHÀ HÀNG NỔI CHỢ NỔI NAM BỘ (QUÁN)
// =============================================================================
function drawQuan(w, h, now) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1], top = 70, bottom = 45;
  const s = Math.max(1, Math.min((w - 50) / X, (h - top - bottom) / Z));
  const ox = (w - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;

  // 1. Sàn thuyền gỗ Quán Ăn Chợ Nổi
  ctx.fillStyle = "#9a6c42"; // Gỗ sao đước mộc mạc
  ctx.fillRect(sx(0), sy(Z), X * s, Z * s);

  // Vân ván sàn thuyền
  ctx.strokeStyle = "rgba(62, 39, 21, 0.4)";
  ctx.lineWidth = 1.5;
  for (let vz = 1; vz < Z; vz += 1) {
    ctx.beginPath();
    ctx.moveTo(sx(0), sy(vz));
    ctx.lineTo(sx(X), sy(vz));
    ctx.stroke();
  }
  ctx.strokeStyle = "#432818";
  ctx.lineWidth = 6;
  ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);

  // 2. Bếp lò đất nung miền Tây (B1, B2)
  (snap.stoves || []).forEach((st) => {
    drawStove(st, sx(st.pos[0]), sy(st.pos[1]), s, now);
  });

  // 3. Bàn ăn và Đơn đặt trước (Tables & Reservations)
  const patMax = (meta.patience_s || 60) * 60;
  const byTable = {};
  (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));

  const resByTable = {};
  (snap.reservations || []).forEach((r) => {
    if (r.table_id) resByTable[r.table_id] = r;
  });

  (snap.tables || []).forEach((tb) => {
    const tbx = sx(tb.pos[0]), tby = sy(tb.pos[1]);
    ctx.fillStyle = "#6d4c41";
    ctx.beginPath();
    ctx.arc(tbx, tby, 1.05 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#3e2723";
    ctx.lineWidth = 2.5;
    ctx.stroke();

    text(tb.id, tbx, tby + 4, { size: 12, weight: "bold", align: "center", color: "#ffffff" });

    // Hiển thị biển ĐẶT CHỖ (Reservation Phase 3)
    const r = resByTable[tb.id];
    if (r && (r.state === "holding" || r.state === "scheduled")) {
      ctx.fillStyle = "#ffb300";
      ctx.fillRect(tbx - 1.15 * s, tby - 1.75 * s, 2.3 * s, 0.6 * s);
      text("📌 " + r.id, tbx, tby - 1.3 * s, { size: 9, weight: "bold", align: "center", color: "#3e2723" });
    }

    // Khách đang ngồi ăn / chờ món
    const c = byTable[tb.id];
    if (c) {
      const cx = tbx, cy = tby - 1.65 * s;
      ctx.fillStyle = c.state === "eating" ? "#43a047" : "#ec407a";
      ctx.beginPath();
      ctx.arc(cx, cy, 0.6 * s, 0, Math.PI * 2);
      ctx.fill();

      // Nếu đang ăn: vẽ khói thơm bốc lên
      if (c.state === "eating") {
        ctx.fillStyle = "rgba(255,255,255,0.45)";
        ctx.beginPath();
        ctx.arc(cx, cy - 0.85 * s - ((now / 20) % 15) * 0.1 * s, 2, 0, Math.PI * 2);
        ctx.fill();
      }

      text(DISH_NAME[c.dish_id] || c.dish_id || "Khách", cx, cy - 0.85 * s, { size: 10, weight: "bold", align: "center", color: "#ffffff" });
      if (c.patience_ticks_left !== undefined) {
        bar(cx - 0.9 * s, cy + 0.7 * s, 1.8 * s, 6, c.patience_ticks_left / patMax, "#e53935");
      }
    }
  });

  // 4. Người chơi phục vụ
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (meta.interact_radius) {
      ctx.strokeStyle = "rgba(255, 255, 255, 0.35)";
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    drawUtSen(px, py, s, 0, false, 0, now);

    if (snap.hand) {
      const handDish = typeof snap.hand === "string" ? snap.hand : (snap.hand.dish_id || "Món");
      text("🍲 " + (DISH_NAME[handDish] || handDish), px, py - 1.1 * s, { size: 11, weight: "bold", align: "center", color: "#ffe082" });
    }
  }

  // 5. HUD QUÁN
  text("⏱ " + fmtTime(snap.time_left_ticks), 16, 32, { size: 22, weight: "bold" });
  text(`Tiền: ${snap.money ?? 0}k · Uy tín: ${(snap.reputation ?? 0).toFixed(1)}⭐ · Điểm: ${snap.score ?? 0}`, 130, 32, { size: 16, weight: "bold", color: "#ffe082" });

  // Kho hàng Quán
  let stockStr = "";
  if (Array.isArray(snap.stock)) {
    const counts = {};
    snap.stock.forEach((it) => {
      const k = typeof it === "object" ? it.kind : it;
      counts[k] = (counts[k] || 0) + 1;
    });
    stockStr = Object.keys(counts).map((k) => `${KIND_NAME[k] || k} ×${counts[k]}`).join(" · ");
  } else if (snap.stock) {
    stockStr = Object.keys(snap.stock).map((k) => `${KIND_NAME[k] || k} ×${snap.stock[k]}`).join(" · ");
  }
  text("📦 Kho nguyên liệu: " + (stockStr || "(Trống)"), 16, 56, { size: 13, color: "#e0e0e0" });

  text("WASD: Đi lại · E: Tương tác Bếp / Giao món Bàn · P: Tạm dừng · R: Chơi lại", w - 16, h - 16, {
    size: 12,
    align: "right",
    color: "#90a4ae"
  });
}

// =============================================================================
// VÒNG LẶP RENDER KHUNG HÌNH (60 FPS)
// =============================================================================
function frame() {
  requestAnimationFrame(frame);
  const now = performance.now();
  const [w, h] = fit();
  ctx.fillStyle = "#091219";
  ctx.fillRect(0, 0, w, h);

  if (snap) {
    if (snap.mode === "quan") {
      drawQuan(w, h, now);
    } else {
      drawGather(w, h, now);
    }
    eventLog(w, h);
    overlay(w, h);
  } else {
    text(offline ? "Không thể kết nối máy chủ backend..." : "Đang kết nối Quán Ăn Chợ Nổi...", w / 2, h / 2, { align: "center", size: 18, color: "#80deea" });
  }
}
requestAnimationFrame(frame);
</script>
